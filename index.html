<!doctype html>
<html lang="nb"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Todo</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:640px;margin:1rem auto;padding:0 1rem}
  form{display:flex;gap:.4rem;flex-wrap:wrap;margin:1rem 0}
  input[type=text]{flex:1;min-width:10rem}
  input,button,select{font:inherit;padding:.4rem}
  li{display:flex;gap:.5rem;align-items:center;padding:.4rem .3rem;border-bottom:1px solid #ddd}
  li .main{flex:1;min-width:0} li small{color:#666}
  .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;cursor:pointer}
  .more{font-size:1.2rem;line-height:1;padding:.3rem .6rem}
  .menu{position:fixed;background:#fff;border:1px solid #999;border-radius:6px;box-shadow:0 4px 14px #0003;display:flex;flex-direction:column;min-width:11rem;z-index:10}
  .menu button{border:0;background:none;text-align:left;padding:.6rem .8rem} .menu button:hover{background:#eef}
  dialog{max-width:32rem;width:90vw;border-radius:8px} #dtext{white-space:pre-wrap;word-break:break-word;margin-bottom:.5rem}
  #eform{display:flex;flex-direction:column;gap:.5rem;margin:0} #eform textarea{min-height:5rem;font:inherit}
  li.ov{border-left:6px solid #d32f2f;background:#fdecea} li.soon{border-left:6px solid #f57c00;background:#fff3e0} li.ok{border-left:6px solid #388e3c;background:#e8f5e9} li.nofreq{border-left:6px solid #9e9e9e;background:#f2f2f2}
  li.w-kids{border-left:6px solid #1e88e5;background:#e3f2fd} li.w-me{border-left:6px solid #8e24aa;background:#f3e5f5} li.w-both{border-left:6px solid #fbc02d;background:#fff9c4}
  li.w-kids.done{background:linear-gradient(90deg,#c8e6c9 50%,#e3f2fd 50%)} li.w-me.done{background:linear-gradient(90deg,#c8e6c9 50%,#f3e5f5 50%)} li.w-both.done{background:linear-gradient(90deg,#c8e6c9 50%,#fff9c4 50%)}
  li.wl{padding:.1rem .3rem} li.wl .clamp{-webkit-line-clamp:1} li.wl button{padding:.1rem .4rem}
  li.hot,li.hot.sprint,li.hot[class*=w-]{border-left:6px solid var(--hot,#b71c1c);background:#ffcdd2!important}
  h1{margin:.3rem 0 .1rem} #status{margin:0 0 .3rem;min-height:1.1em}
  .mv{padding:.2rem .4rem;font-size:.8rem}
  li.sprint{background:#fff8dc}
  nav.bar{gap:.25rem;background:#eef0f4;padding:.25rem;border-radius:999px;width:fit-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
  nav button{font-weight:600;font-size:.85rem;border:0;background:transparent;color:#4a5568;padding:.4rem .85rem;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
  nav button:hover{background:#dde2ea;color:#1a202c}
  nav .on,nav .on:hover{background:#fff;color:var(--accent,#0b3d91);box-shadow:0 1px 4px #0003}
  .dcol{width:3rem;flex:none;font-variant-numeric:tabular-nums;font-weight:600;color:#444;font-size:.9rem}
  .plus{padding:.2rem .55rem;font-weight:bold}
  @media (max-width:600px){
    body{padding:0 .4rem;margin:.5rem auto;font-size:14px}
    li{gap:.25rem;padding:.3rem .15rem}
    li small{font-size:.75rem}
    li button{padding:.2rem .35rem;font-size:.85rem}
    .more{padding:.2rem .4rem;font-size:1.1rem}
    .mv{padding:.1rem .25rem;font-size:.7rem}
    .dcol{width:2.3rem;font-size:.78rem}
    nav button{padding:.35rem .6rem;font-size:.8rem}
  }
  .done .t{text-decoration:line-through;color:#888}
  [hidden]{display:none!important}
  ul{list-style:none;padding:0} #status{color:#555;font-size:.9rem}
  .bar{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0;align-items:center}
  details{margin-top:1.5rem;color:#555}
  body.wide{max-width:1000px}
  #fbtn{display:inline-flex;align-items:center;padding:.4rem .5rem} #fbtn svg{width:1.1rem;height:1.1rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #fbtn.act{background:var(--accent,#0b3d91);color:#fff;border-color:var(--accent,#0b3d91)}
  #adays,#edays{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center} #adays label,#edays label{font-size:.85rem}
  #fdlg .bar,#sdform,#kdlg{margin:.5rem 0} #sdform{display:flex;flex-direction:column;gap:.5rem}
  .chk{padding:.2rem .5rem;font-weight:bold} .chk.on{background:#c8e6c9}
  .dsec{margin-top:.8rem;color:inherit} .dsec>summary{font-weight:600;cursor:pointer;padding:.3rem 0}
  .gh{font-weight:600;margin:.5rem 0 .1rem;color:#444}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
  .cal .dow{font-size:.75rem;color:#666;text-align:center}
  .cell{background:#fafafa;border:1px solid #e3e3e3;border-radius:6px;min-height:4.4rem;padding:2px;overflow:hidden}
  .cell.today{outline:2px solid var(--accent,#0b3d91);background:#fff} .cell.other{opacity:.4}
  .cell .dn{font-size:.7rem;color:#555;font-weight:600} .cell .dm{display:none}
  .chip{font-size:.68rem;line-height:1.25;color:#fff;border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .chip.done{opacity:.45;text-decoration:line-through} .chip.kt{color:#000}
  .legend{display:flex;flex-wrap:wrap;gap:.2rem .7rem;font-size:.75rem;margin:.3rem 0}
  .legend i{display:inline-block;width:.7rem;height:.7rem;border-radius:3px;margin-right:.25rem;vertical-align:middle}
  .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.5rem .8rem;margin:.5rem 0}
  .sgrid label{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .sgrid input[type=color]{width:3rem;height:1.8rem;padding:0;border:1px solid #bbb;border-radius:4px;background:none}
  @media (max-width:600px){
    .cal{grid-template-columns:1fr} .cal .dow{display:none}
    .cell{min-height:0;padding:3px 5px} .cell .dd{display:none} .cell .dm{display:inline;font-size:.8rem}
    .cell.empty:not(.today),.cell.other{display:none}
    .chip{font-size:.78rem;white-space:normal}
  }
</style></head>
<body>
<nav class="bar">
  <button data-page="dash">Dashboard</button>
  <button data-page="work">WorkTODO</button>
  <button data-page="priv">PrivTODO</button>
  <button data-page="backlog">Backlog</button>
  <button data-page="quick">Quick</button>
  <button data-page="recurring">Tog</button>
  <button data-page="interval">Recurring</button>
  <button data-page="watch">Watchlist</button>
  <button data-page="mat">Mat</button>
  <button data-page="kveld">Kveld</button>
  <button data-page="settings" title="Settings">⚙</button>
</nav>
<h1 id="h"></h1>
<div id="status"></div>
<form id="add">
  <input type="text" id="title" placeholder="New task" required>
  <select id="cat"></select>
  <select id="pri"></select>
  <input type="date" id="due" title="Dato">
  <label id="aspl"><input type="checkbox" id="asp"> Sprint</label>
  <span id="adays"></span>
  <input type="number" id="freq" min="1" step="1" placeholder="Hver N dager" title="Frekvens (dager)" style="width:8rem">
  <input type="date" id="lastd" title="Sist gjort">
  <select id="wsrc"></select><select id="wwho"></select>
  <button>Add</button>
  <button type="button" id="fbtn" title="Sortering og filter" aria-label="Sortering og filter"><svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg></button>
</form>
<ul id="list"></ul>
<div id="pagebox"></div>
<details id="settings"><summary>Innstillinger (ny enhet, sikkerhetskopi)</summary>
  <div class="bar">
    <button id="cloud">Cloud setup</button>
    <button id="code">Copy setup code</button>
    <button id="export">Export</button>
    <button id="import">Import</button>
    <input type="file" id="file" accept=".json" hidden>
  </div>
</details>
<dialog id="fdlg"><b>Sortering og filter</b>
  <div id="sortbar" class="bar">Sorter: <select id="skey"></select> <select id="sdir"></select></div>
  <div id="filterbar" class="bar">Filter: <select id="fcat"></select> <label><input type="checkbox" id="fsprint"> Sprint only</label></div>
  <div id="wfilter" class="bar">Filter: <select id="fsrc"></select> <select id="fwho"></select> <label><input type="checkbox" id="fshow"> Show watched</label></div>
  <div id="qfilter" class="bar"><label><input type="checkbox" id="fqdone"> Vis ferdige</label></div>
  <div class="bar"><button id="fclose">Lukk</button></div></dialog>
<dialog id="sdd"><form id="sdform"><b id="sdt"></b><input type="date" id="sdate"><small id="sdn"></small>
  <div class="bar"><button>Lagre</button><button type="button" id="sdout">Ut av sprint</button><button type="button" id="sdcancel">Avbryt</button></div></form></dialog>
<dialog id="kdlg"><b id="kdt"></b><ul id="kdl"></ul><small id="kdn"></small>
  <div class="bar"><button id="kdok"></button><button id="kdclose">Lukk</button></div></dialog>
<dialog id="detail"><div id="dtext"></div><small id="dmeta"></small>
  <div class="bar"><button id="dedit">Edit</button><button id="dclose">Close</button></div></dialog>
<dialog id="editd"><form id="eform">
  <textarea id="etitle" required></textarea>
  <select id="ecat"></select><select id="esrc"></select><select id="ewho"></select><select id="epri"></select><input type="date" id="edue" title="Dato">
  <label id="espl"><input type="checkbox" id="esp"> I sprint</label>
  <div id="edays"></div>
  <label id="efl">Hver <input type="number" id="efreq" min="1" step="1" style="width:5rem"> dager</label>
  <label id="ell">Sist gjort <input type="date" id="elast"></label>
  <div class="bar"><button>Save</button><button type="button" id="ecancel">Cancel</button></div>
</form></dialog>
<script src="core.js"></script>
<script>
const C = TodoCore, KEY = 'todo-store';
let store = localStorage[KEY] ? C.parse(localStorage[KEY]) : C.emptyStore();
C.seedRecurring(store); C.seedInterval(store); C.seedWatch(store); C.seedBacklog(store); C.seedToglesing(store);
let page = localStorage['todo-page'] || 'work';
const $ = id => document.getElementById(id);
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const say = m => $('status').textContent = m;
const opt = (sel, v, t) => sel.add(new Option(t, v));
const pageOf = i => String(i.id).startsWith('rec-') ? 'recurring' : (i.list || 'work');
C.CATEGORIES.forEach(c => { opt($('cat'), c, c); });
C.SOURCES.forEach(s => { opt($('wsrc'), s, s); opt($('esrc'), s, s); });
Object.entries(C.WHO).forEach(([k, v]) => { opt($('wwho'), k, v); opt($('ewho'), k, v); });
opt($('fsrc'), '', 'All sources'); C.SOURCES.forEach(s => opt($('fsrc'), s, s));
opt($('fwho'), '', 'Everyone'); Object.entries(C.WHO).forEach(([k, v]) => opt($('fwho'), k, v));
$('fsrc').onchange = $('fwho').onchange = $('fshow').onchange = $('fqdone').onchange = () => render();
opt($('fcat'), '', 'All categories'); C.CATEGORIES.forEach(c => opt($('fcat'), c, c));
opt($('pri'), '', 'Priority'); Object.entries(C.PRIORITIES).forEach(([k, v]) => opt($('pri'), k, v));
$('fcat').onchange = $('fsprint').onchange = () => render();
const persist = () => { localStorage[KEY] = JSON.stringify(store); render(); };
const save = () => { persist(); scheduleCloud(); };

// ---- Cloud sync through a private GitHub Gist (works on any device, no DNB account needed) ----
const CK = 'todo-cloud';   // { token, gistId }
const cfg = () => { try { return JSON.parse(localStorage[CK] || 'null'); } catch { return null; } };
const FILE = 'todo-data.json';
async function gh(path, opt = {}) {
  const c = cfg();
  const r = await fetch('https://api.github.com' + path, { ...opt, cache: 'no-store', headers: { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' } });
  if (!r.ok) throw new Error('GitHub ' + r.status);
  return r.json();
}
let busy = false, again = false, timer;
async function cloudSync() {
  const c = cfg(); if (!c) return false;
  if (busy) { again = true; return true; }
  busy = true;
  try {
    say('Syncing…');
    const g = await gh('/gists/' + c.gistId);
    let f = g.files[FILE], text = f ? (f.truncated ? await (await fetch(f.raw_url)).text() : f.content) : '';
    const remote = text.trim() ? C.parse(text) : C.emptyStore();
    const merged = C.merge(store, remote);
    const out = JSON.stringify(merged, null, 2);
    const changedRemote = JSON.stringify(C.merge(remote, remote)) !== JSON.stringify(merged);
    store = merged; C.seedRecurring(store); C.seedInterval(store); C.seedWatch(store); C.seedBacklog(store); C.seedToglesing(store); persist();
    if (changedRemote || !f) await gh('/gists/' + c.gistId, { method: 'PATCH', body: JSON.stringify({ files: { [FILE]: { content: JSON.stringify(store, null, 2) } } }) });
    say('Synced ' + new Date().toLocaleTimeString() + ' · cloud ' + c.gistId.slice(0, 6) + ' · ' + C.activeItems(store).length + ' items');
  } catch (e) { say('Cloud sync failed: ' + e.message + ' (changes are kept on this device)'); }
  finally { busy = false; if (again) { again = false; scheduleCloud(); } }
  return true;
}
function scheduleCloud() { if (!cfg()) return; clearTimeout(timer); timer = setTimeout(cloudSync, 1500); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) cloudSync(); });
addEventListener('online', cloudSync);
setInterval(() => { if (!document.hidden) cloudSync(); }, 60000);  // pick up changes from other devices

$('cloud').onclick = async () => {
  let input = (prompt('Paste EITHER your GitHub token (starts with ghp_) OR a setup link/code from another device:') || '').trim();
  if (!input) return;
  if (input.includes('#setup=')) input = decodeURIComponent(input.split('#setup=')[1]);
  try {
    if (/^(ghp_|github_pat_)/.test(input)) {
      localStorage[CK] = JSON.stringify({ token: input, gistId: '' });
      const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'todo-sync data', public: false, files: { [FILE]: { content: JSON.stringify(store, null, 2) } } }) });
      localStorage[CK] = JSON.stringify({ token: input, gistId: g.id });
    } else {
      const c = JSON.parse(atob(input));
      if (!c.token || !c.gistId) throw new Error('This is not a setup code');
      localStorage[CK] = JSON.stringify(c);
    }
    await cloudSync();
  } catch (e) { localStorage.removeItem(CK); say('Setup failed: ' + e.message + ' - paste a GitHub token (ghp_...) or a setup code.'); }
};
$('code').onclick = async () => {
  if (!cfg()) return say('Set up cloud first.');
  const code = location.origin + location.pathname + '#setup=' + encodeURIComponent(btoa(localStorage[CK]));
  try { await navigator.clipboard.writeText(code); say('Setup link copied. Open it on the other device. Keep it private.'); }
  catch { prompt('Copy this setup link:', code); }
};

function pageTitle() { return { work: 'WorkTODO', priv: 'PrivTODO', backlog: 'Backlog', quick: 'Quick', recurring: 'Tog', interval: 'Recurring', watch: 'Watchlist', mat: 'Mat', dash: 'Dashboard', kveld: 'Kveld', settings: 'Settings' }[page]; }
const FQ = ['recurring', 'interval'];
// Tog items without a saved frequency count as 30 days.
const fOf = it => it.intervalDays || (pageOf(it) === 'recurring' ? 30 : null);   // pages with a frequency
const MON = ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'des'];
const dm = d => d ? d.slice(8, 10) + '/' + MON[+d.slice(5, 7) - 1] : '–';
const dayNo = d => Math.round(Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) / 864e5);

// ---- Frequency pages (Tog and Recurring) ----
function nextDue(it) {
  if (!it.lastPerformed || !fOf(it)) return null;
  return new Date((dayNo(it.lastPerformed) + fOf(it)) * 864e5).toISOString().slice(0, 10);
}
function ivDays(it) {
  const n = nextDue(it);
  return { since: it.lastPerformed ? dayNo(today()) - dayNo(it.lastPerformed) : null, left: n ? dayNo(n) - dayNo(today()) : null };
}
// Recurring: red = overdue, orange = due in 7 days, green = other.
function ivClass(it) {
  const { left } = ivDays(it);
  return left === null || left < 0 ? 'ov' : left <= 7 ? 'soon' : 'ok';
}
// Tog: red = never done, or more than 14 days over the frequency. Orange = from 7 days before to 14 days after. Green = other.
function togClass(it) {
  if (!it.lastPerformed) return 'ov';
  if (!fOf(it)) return 'nofreq';
  const d = ivDays(it).since - fOf(it);
  return d > 14 ? 'ov' : d >= -7 ? 'soon' : 'ok';
}
// How red an item is: higher = more overdue. Never done = most red. No frequency = no score.
function togScore(it) {
  if (!it.lastPerformed) return 1e9;
  return fOf(it) ? ivDays(it).since - fOf(it) : null;
}
function ivText(it) {
  const { since, left } = ivDays(it);
  const f = fOf(it) ? 'Hver ' + fOf(it) + ' d' : 'Frekvens ikke satt';
  const s = 'Sist: ' + (it.lastPerformed ? dm(it.lastPerformed) + ' (' + since + ' d siden)' : 'aldri');
  if (it.list === 'recurring' && fOf(it)) {
    const d = it.lastPerformed ? since - fOf(it) : null;
    return [f, s, 'Neste: ' + dm(nextDue(it)) + (d === null ? '' : d < 0 ? ' (om ' + -d + ' d)' : ' (' + d + ' d over)')].join(' · ');
  }
  return [f, s, 'Neste: ' + dm(nextDue(it)) + (left === null ? '' : left < 0 ? ' (' + -left + ' d over)' : ' (om ' + left + ' d)')].join(' · ');
}

function metaText(it) {
  const p = pageOf(it);
  if (it.hot && !it.done && p !== 'priv' && p !== 'watch' && p !== 'work') return '★ ' + dm(it.dueDate);
  if (p === 'work') return it.sprint ? 'Sprint' : '';
  if (p === 'watch') return [it.source, it.alsoOn && it.alsoOn.length && 'Også: ' + it.alsoOn.join(', '), C.WHO[it.who]].filter(Boolean).join(' · ');
  if (FQ.includes(p)) return ivText(it);
  if (p === 'priv') return [it.category, it.priority && 'Prio: ' + C.PRIORITIES[it.priority], it.sprint && 'Sprint'].filter(Boolean).join(' · ');
  return '';
}

// ---- Sorting ----
const text = f => ({ type: 'text', get: i => { const v = f(i); return v ? String(v).toLowerCase() : null; } });
const SORTS = {
  work: { manual: { label: 'Manuell rekkefølge', manual: true }, name: { label: 'Navn', ...text(i => i.title) }, due: { label: 'Dato', type: 'date', get: i => i.dueDate }, created: { label: 'Opprettet', type: 'date', get: i => i.createdAt } },
  priv: { manual: { label: 'Manuell rekkefølge', manual: true }, name: { label: 'Navn', ...text(i => i.title) }, due: { label: 'Dato', type: 'date', get: i => i.dueDate }, pri: { label: 'Prioritet', type: 'pri', get: i => i.priority }, cat: { label: 'Kategori', ...text(i => i.category) }, created: { label: 'Opprettet', type: 'date', get: i => i.createdAt } },
  backlog: { created: { label: 'Opprettet', type: 'date', get: i => i.createdAt }, name: { label: 'Navn', ...text(i => i.title) } },
  quick: { created: { label: 'Opprettet', type: 'date', get: i => i.createdAt }, name: { label: 'Navn', ...text(i => i.title) } },
  mat: { name: { label: 'Navn', ...text(i => i.title) }, created: { label: 'Opprettet', type: 'date', get: i => i.createdAt } },
  recurring: { red: { label: 'Mest røde', type: 'red', get: togScore }, name: { label: 'Navn', ...text(i => i.title) }, last: { label: 'Sist gjort', type: 'date', get: i => i.lastPerformed }, next: { label: 'Neste', type: 'date', get: nextDue }, freq: { label: 'Frekvens', type: 'num', get: fOf } },
  interval: { next: { label: 'Neste', type: 'date', get: nextDue }, name: { label: 'Navn', ...text(i => i.title) }, last: { label: 'Sist gjort', type: 'date', get: i => i.lastPerformed }, freq: { label: 'Frekvens', type: 'num', get: fOf } },
  watch: { manual: { label: 'Manuell rekkefølge', manual: true }, name: { label: 'Navn', ...text(i => i.title) }, src: { label: 'Kilde', ...text(i => i.source) }, who: { label: 'For hvem', type: 'num', get: i => ({ kids: 1, me: 2, both: 3 })[i.who] }, created: { label: 'Opprettet', type: 'date', get: i => i.createdAt } },
};
const DIRS = { text: ['A–Å', 'Å–A'], date: ['Eldst først', 'Nyest først'], num: ['Lavest først', 'Høyest først'], pri: ['Høy først', 'Lav først'], red: ['Minst røde først', 'Mest røde først'] };
const DEFAULT_SORT = { work: { key: 'manual', dir: 'asc' }, priv: { key: 'manual', dir: 'asc' }, watch: { key: 'manual', dir: 'asc' }, backlog: { key: 'created', dir: 'asc' }, quick: { key: 'created', dir: 'asc' }, mat: { key: 'name', dir: 'asc' }, recurring: { key: 'red', dir: 'desc' }, interval: { key: 'next', dir: 'asc' } };
const SK = 'todo-sort';
const sortAll = () => { try { return JSON.parse(localStorage[SK] || '{}'); } catch { return {}; } };
const NOSORT = ['quick', 'recurring', 'interval'];
const sortState = p => { const s = NOSORT.includes(p) ? null : sortAll()[p]; return s && SORTS[p][s.key] ? s : DEFAULT_SORT[p]; };
const setSort = (p, st) => { const a = sortAll(); a[p] = st; localStorage[SK] = JSON.stringify(a); render(); };
// Empty values always go last, in both directions.
function cmpv(x, y, dir) {
  const nx = x == null || x === '', ny = y == null || y === '';
  if (nx || ny) return nx && ny ? 0 : nx ? 1 : -1;
  return (typeof x === 'string' ? x.localeCompare(y, 'nb') : x - y) * dir;
}
const byCreated = (a, b) => a.createdAt < b.createdAt ? -1 : a.createdAt > b.createdAt ? 1 : 0;
// The order used for items without a manual position, and for ties.
const fallback = p => (p === 'priv' || p === 'work')
  ? (a, b) => (!!b.sprint - !!a.sprint) || ((a.priority || 9) - (b.priority || 9)) || cmpv(a.dueDate, b.dueDate, 1) || byCreated(a, b)
  : byCreated;
function sortItems(items, p) {
  const st = sortState(p), def = SORTS[p][st.key], dir = st.dir === 'desc' ? -1 : 1, fb = fallback(p);
  items.sort((a, b) => (!!a.done - !!b.done) || (!!b.hot - !!a.hot) || (def.manual ? cmpv(a.order, b.order, 1) : cmpv(def.get(a), def.get(b), dir)) || fb(a, b));
}
const isManual = p => !!SORTS[p] && !!SORTS[p][sortState(p).key].manual;

// Swap the manual position of two neighbours. First give every item on the page a unique position.
function moveItem(a, b) {
  if (!b) return;
  const fb = fallback(page);
  C.activeItems(store).filter(i => pageOf(i) === page).sort((x, y) => cmpv(x.order, y.order, 1) || fb(x, y))
    .forEach((i, n) => { if (i.order !== n + 1) C.updateItem(store, i.id, { order: n + 1 }); });
  const oa = store.items[a.id].order, ob = store.items[b.id].order;
  C.updateItem(store, a.id, { order: ob }); C.updateItem(store, b.id, { order: oa });
  save();
}

}

const DK = 'todo-dash';

}
function selectOf(opts, val, fn) {

function legend(kinds, kv) {

  c.style.background = 'var(--c-' + p + ')'; c.title = KINDS[p] + ': ' + it.title + (late === 'none' ? ' (uten dato - klikk for å sette dato)' : late === 'old' ? ' (dato passert - klikk for å sette ny dato)' : '');

function buildSprint() {
  const D = dash(), r = C.sprintRange(S(), today()), box = el('div');
  const bar = el('div', 'bar'); bar.append(el('b', null, 'Sprint ' + dm(r.start) + ' – ' + dm(r.end)),
    selectOf([['both', 'Work + privat'], ['work', 'Bare work'], ['priv', 'Bare privat']], D.sf, v => setDash({ sf: v })));
  const lab = el('label'); const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = D.kv; cb.onchange = () => setDash({ kv: cb.checked }); lab.append(cb, ' Kveldsrutine'); bar.append(lab);
  box.append(bar, legend(D.sf === 'both' ? ['work', 'priv'] : [D.sf], D.kv && D.sf !== 'work'));

  C.activeItems(store).filter(i => i.sprint && ['work', 'priv'].includes(pageOf(i)) && (D.sf === 'both' || pageOf(i) === D.sf)).sort(byCreated).forEach(it => {
    if (!it.dueDate) put(r.start, chip(it, 'none'));

function buildMonth() {
  const D = dash(), [y, m] = D.month.split('-').map(Number), pad = n => String(n).padStart(2, '0');
  const first = y + '-' + pad(m) + '-01', dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const lead = C.weekday(first) - 1, rows = Math.ceil((lead + dim) / 7), g0 = C.dayNum(first) - lead;
  const shift = k => { const t = new Date(Date.UTC(y, m - 1 + k, 1)); setDash({ month: t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) }); };
  const box = el('div'), bar = el('div', 'bar');
  bar.append(mk('◀', '', 'Forrige måned', () => shift(-1)), el('b', null, MONTHS[m - 1] + ' ' + y), mk('▶', '', 'Neste måned', () => shift(1)),
    mk('I dag', '', '', () => setDash({ month: today().slice(0, 7) })),
    selectOf([['all', 'Alt samlet'], ['work', 'Bare work'], ['other', 'Alt annet']], D.mf, v => setDash({ mf: v })));
  const lab = el('label'); const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = D.kv; cb.onchange = () => setDash({ kv: cb.checked }); lab.append(cb, ' Kveldsrutine'); bar.append(lab);
  const kinds = Object.keys(KINDS).filter(k => D.mf === 'all' || (D.mf === 'work') === (k === 'work'));
  box.append(bar, legend(kinds, D.kv && D.mf !== 'work'));
  const byDate = {};
  C.activeItems(store).forEach(it => {
    const p = pageOf(it), d = calDate(it);
    if (!d || !kinds.includes(p)) return;
    (byDate[d] = byDate[d] || []).push(it);
  });
  const grid = el('div', 'cal'); dowHeader(grid);
  for (let k = 0; k < rows * 7; k++) {
    const d = C.isoDay(g0 + k), chips = (byDate[d] || []).sort(byCreated).map(it => chip(it));
    const kc = D.kv && D.mf !== 'work' && d.slice(0, 7) === D.month ? kveldChip(d) : null;
    grid.append(cell(d, kc ? [...chips, kc] : chips, d.slice(0, 7) !== D.month));
  }
  box.append(grid); return box;
}

function renderDash() {
  const box = $('pagebox');
  box.append(section('star', '★ Viktig (stjernemarkert)', buildStars), section('sprint', 'Sprint', buildSprint), section('month', 'Måned', buildMonth));
}

// Evening routine popup: show the activities of a date and mark the whole routine as done.
function openKveld(date) {
  const { state, acts } = C.kveldStatus(store, date, today());
  $('kdt').textContent = 'Kveldsrutine ' + DAYS_FULL[C.weekday(date) - 1] + ' ' + dm(date);
  $('kdl').innerHTML = ''; acts.forEach(a => $('kdl').append(el('li', null, a.title)));
  const done = state === 'done', future = date > today();
  $('kdn').textContent = done ? 'Gjennomført.' : future ? 'Kan ikke kvitteres ut før dagen.' : state === 'miss' ? 'Ikke gjennomført.' : '';
  $('kdok').textContent = done ? 'Angre kvittering' : 'Kvitter ut ✓'; $('kdok').disabled = future;
  $('kdok').onclick = () => { C.setKveldDone(store, date, !done); $('kdlg').close(); save(); };
  $('kdlg').showModal();
}
$('kdclose').onclick = () => $('kdlg').close();
$('kdlg').addEventListener('click', e => { if (e.target === $('kdlg')) $('kdlg').close(); });

// ---- Kveld page ----
const KDAY = 'todo-kveld-day';
function renderKveld() {
  const box = $('pagebox'), sel = localStorage[KDAY] || 'all', tw = C.weekday(today());
  const bar = el('div', 'bar');
  [['all', 'Alle'], ...C.DAY_NAMES.map((n, i) => [String(i + 1), n])].forEach(([v, t]) => {
    const b = mk(t + (v === String(tw) ? ' •' : ''), v === sel ? 'chk on' : 'chk', '', () => { localStorage[KDAY] = v; render(); }); bar.append(b);
  });
  bar.append(mk('Kvitter ut i dag', '', 'Åpne dagens rutine', () => openKveld(today())));
  box.append(bar);
  const acts = sel === 'all' ? C.kveldActs(store) : C.kveldFor(store, +sel);
  if (!acts.length) box.append(el('small', null, 'Ingen aktiviteter.'));
  const ul = el('ul');
  acts.forEach(a => {
    const li = el('li', 'wl'), main = el('div', 'main');
    main.append(el('div', 't', a.title));
    if (sel === 'all') main.append(el('small', null, (a.days || []).length === 7 ? 'Hver dag' : (a.days || []).map(d => C.DAY_NAMES[d - 1]).join(' ')));
    li.append(main);
    const m = mk('⋯', 'more', 'Actions', e => { e.stopPropagation(); showMenu(m, a); }); li.append(m); ul.append(li);
  });
  box.append(ul, el('small', null, 'Kvittering og historikk (grønn/rød) ligger i kalenderne i Dashboard.'));
}

// ---- Settings page ----
const COLOR_LABELS = { accent: 'Aksent (topp-knapper)', hot: 'Stjerne / viktig', work: 'Kalender: WorkTODO', priv: 'Kalender: PrivTODO', recurring: 'Kalender: Tog', interval: 'Kalender: Recurring', quick: 'Kalender: Quick', kveldDone: 'Kveld: gjort', kveldMiss: 'Kveld: ikke gjort', kveldToday: 'Kveld: i dag', kveldOpen: 'Kveld: senere' };
function renderSettings() {
  const s = S(), box = $('pagebox'), cfg = () => ({ sprintStart: s.sprintStart, sprintDays: s.sprintDays, colors: { ...s.colors } });
  const commit = c => { C.saveSettings(store, c); save(); };
  box.append(el('div', 'gh', 'Sprint'));
  const g = el('div', 'sgrid');
  const l1 = el('label', null, 'Første sprint starter (mandag)'), d1 = document.createElement('input'); d1.type = 'date'; d1.value = s.sprintStart;
  d1.onchange = () => { if (!d1.value) return; if (C.weekday(d1.value) !== 1) say('Sprintstart bør være en mandag.'); const c = cfg(); c.sprintStart = d1.value; commit(c); };
  l1.append(d1);
  const l2 = el('label', null, 'Sprintlengde (dager)'), d2 = document.createElement('input'); d2.type = 'number'; d2.min = 7; d2.max = 28; d2.value = s.sprintDays; d2.style.width = '4rem';
  d2.onchange = () => { const c = cfg(); c.sprintDays = Math.min(28, Math.max(7, Math.round(+d2.value) || 14)); commit(c); };
  l2.append(d2); g.append(l1, l2); box.append(g);
  const r = C.sprintRange(s, today()); box.append(el('small', null, 'Gjeldende sprint: ' + dm(r.start) + ' – ' + dm(r.end)));
  box.append(el('div', 'gh', 'Farger'));
  const cg = el('div', 'sgrid');
  Object.entries(COLOR_LABELS).forEach(([k, t]) => {
    const l = el('label', null, t), i = document.createElement('input'); i.type = 'color'; i.value = s.colors[k];
    i.onchange = () => { const c = cfg(); c.colors[k] = i.value; commit(c); }; l.append(i); cg.append(l);
  });
  box.append(cg, mk('Tilbakestill til standard', '', '', () => { if (confirm('Tilbakestille alle innstillinger?')) commit({ sprintStart: C.DEFAULT_SETTINGS.sprintStart, sprintDays: C.DEFAULT_SETTINGS.sprintDays, colors: { ...C.DEFAULT_SETTINGS.colors } }); }));
  $('settings').open = true;
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => { page = b.dataset.page; localStorage['todo-page'] = page; render(); });

$('add').onsubmit = e => {
  e.preventDefault();
  const f = { list: page };
  if (page === 'watch') {
    const mn = Math.min(1, ...C.activeItems(store).filter(i => i.list === 'watch').map(i => i.order || 0));
    Object.assign(f, { source: $('wsrc').value, who: $('wwho').value, alsoOn: [], order: mn - 1 });   // new titles go to the top
  }
  if (FQ.includes(page)) Object.assign(f, { intervalDays: Math.round(+$('freq').value) || 30, lastPerformed: $('lastd').value || (page === 'interval' ? today() : null) });
  if (page === 'priv') Object.assign(f, { category: $('cat').value, priority: +$('pri').value || null });
  if (page === 'priv' || page === 'work') {
    const date = $('due').value || (page === 'priv' ? today() : null), sp = $('asp').checked;
    Object.assign(f, { dueDate: date, sprint: sp }, C.datePatch({ sprint: sp }, date, S(), today()));
  }
  if (page === 'kveld') {
    f.days = [...$('adays').querySelectorAll('input')].filter(c => c.checked).map(c => +c.dataset.d);
    if (!f.days.length) return say('Velg minst én dag.');
  }
  C.addItem(store, $('title').value.trim(), f);
  $('title').value = ''; $('freq').value = ''; $('lastd').value = ''; $('pri').value = ''; $('due').value = ''; $('asp').checked = false; save();
};

$('export').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' }));
  a.download = 'todo-data.json'; a.click();
};
$('import').onclick = () => $('file').click();
$('file').onchange = async e => {
  try { store = C.merge(store, C.parse(await e.target.files[0].text())); save(); say('Imported and merged.'); }
  catch (err) { say('Import failed: ' + err.message); }
  e.target.value = '';
};
if (location.hash.startsWith('#setup=')) {
  try {
    const c = JSON.parse(atob(decodeURIComponent(location.hash.slice(7))));
    if (!c.token || !c.gistId) throw new Error('bad link');
    localStorage[CK] = JSON.stringify(c); say('Cloud set up from link.');
  } catch (e) { say('Setup link failed: ' + e.message); }
  history.replaceState(null, '', location.pathname);
}
if (!SORTS[page] && !SPECIAL.includes(page)) page = 'work';
render();
if (!cfg()) say('Cloud sync er ikke satt opp. Åpne Settings-fanen (⚙).');
cloudSync();
</script></body></html>
